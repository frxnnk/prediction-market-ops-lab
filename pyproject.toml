[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-market-ops-lab"
version = "0.1.0"
description = "Safety-first operations lab for public prediction-market integrations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "eth-account>=0.13.7,<0.14",
    "fastapi>=0.139,<0.140",
    "httpx>=0.28.1,<0.29",
    "uvicorn[standard]>=0.41,<0.42",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.15.21,<0.16",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
